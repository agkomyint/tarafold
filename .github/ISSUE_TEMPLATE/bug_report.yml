name: Bug report
description: Something crashes, errors, or behaves differently from the docs.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `tarafold --version`
    validations: { required: true }
  - type: input
    id: os
    attributes:
      label: OS and architecture
    validations: { required: true }
  - type: textarea
    id: command
    attributes:
      label: Command
      render: shell
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations: { required: true }
  - type: textarea
    id: data
    attributes:
      label: Minimal data to reproduce
      description: A small CSV or a `tarafold synth` command. Do not share sensitive data.
