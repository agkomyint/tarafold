name: Feature request
description: Propose a new capability or algorithm.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Tarafold can't do today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: measure
    attributes:
      label: How would we measure it?
      description: Which benchmark metric or dataset would show the improvement?
