name: Release

on:
  push:
    tags: ["v*"]
  # Re-run a release for an existing tag with the workflow from the default branch
  # (for example after a runner outage), without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The single-file web UI, embedded into every binary (report.html and `tarafold serve`).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g pnpm@11
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist-single
          path: web/dist-single/index.html
          if-no-files-found: error

  build:
    needs: web
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macOS builds are paused: hosted macOS runners did not pick up jobs (2026-11-18).
        # To restore, add back:
        #   - { name: macos, targets: "aarch64-apple-darwin x86_64-apple-darwin", os: macos-latest, archive: tar.gz }
        include:
          - { name: windows, targets: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }
          - { name: linux-x86_64, targets: x86_64-unknown-linux-musl, os: ubuntu-latest, archive: tar.gz }
          - { name: linux-aarch64, targets: aarch64-unknown-linux-musl, os: ubuntu-latest, archive: tar.gz, cross: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: web-dist-single
          path: web/dist-single

      - uses: dtolnay/rust-toolchain@stable
      - name: Add targets
        shell: bash
        run: for t in ${{ matrix.targets }}; do rustup target add "$t"; done
      - if: contains(matrix.targets, 'x86_64-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do
            if [ "${{ matrix.cross }}" = "true" ]; then
              cross build --release --locked -p tarafold-cli --target "$t"
            else
              cargo build --release --locked -p tarafold-cli --target "$t"
            fi
          done
      - name: Check the binaries run and embed the UI
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do
            bin="target/$t/release/tarafold"
            [ "${{ matrix.archive }}" = "zip" ] && bin="$bin.exe"
            "$bin" --version
            "$bin" synth linear --rows 300 --out "check-$t"
            "$bin" run "check-$t/data.csv" --target y --stability 0 --out "check-$t/out" > /dev/null
            grep -q 'id="root"' "check-$t/out/report.html"
          done
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          for t in ${{ matrix.targets }}; do
            name="tarafold-${TAG}-$t"
            mkdir -p "dist/$name"
            bin="tarafold"; [ "${{ matrix.archive }}" = "zip" ] && bin="tarafold.exe"
            cp "target/$t/release/$bin" README.md LICENSE CHANGELOG.md "dist/$name/"
            (
              cd dist
              if [ "${{ matrix.archive }}" = "zip" ]; then
                7z a "$name.zip" "$name" > /dev/null
              else
                tar czf "$name.tar.gz" "$name"
              fi
              rm -rf "$name"
            )
          done
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.name }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: All three platforms present (Windows, Linux x86_64, Linux aarch64)
        run: |
          ls dist
          test "$(ls dist | wc -l)" -eq 3
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - name: SBOM (CycloneDX)
        # Output file naming differs between cargo-cyclonedx versions, so search for it.
        continue-on-error: true
        run: |
          cargo cyclonedx --format json --manifest-path crates/tarafold-cli/Cargo.toml
          f=$(find crates/tarafold-cli -maxdepth 1 -name '*.cdx.json' | head -n1)
          if [ -n "$f" ]; then cp "$f" "dist/tarafold-${TAG}.cdx.json"; else echo "::warning::no SBOM file produced"; fi
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes $prerelease
