[package]
name = "tarafold-cli"
description = "The tarafold command-line tool: numerical discovery engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "tarafold"
path = "src/main.rs"

[dependencies]
tarafold-core.workspace = true
tarafold-io.workspace = true
tarafold-synth.workspace = true
tarafold-report.workspace = true
tarafold-engine.workspace = true
tarafold-bench.workspace = true
tarafold-profile.workspace = true
tarafold-server = { workspace = true, optional = true }
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
toml.workspace = true
ctrlc = "3.5.3"
rayon.workspace = true

[features]
# The local web server (tarafold serve). On by default; disable for a smaller binary.
default = ["serve"]
serve = ["dep:tarafold-server"]

[dev-dependencies]
jsonschema.workspace = true
assert_cmd.workspace = true
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true
