[package]
name = "tarafold-server"
description = "Local HTTP server for the Tarafold web UI (loopback, token-authenticated)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tarafold-core.workspace = true
tarafold-engine.workspace = true
tarafold-report.workspace = true
tarafold-expr.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
getrandom = "0.4.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
thiserror.workspace = true
tokio-stream = { version = "0.1.19", features = ["sync"] }

[dev-dependencies]
tarafold-synth.workspace = true
tarafold-io.workspace = true

[lints]
workspace = true

